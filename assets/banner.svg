<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#titleGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 15px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #f8fafc; }
    
    @keyframes pulseRing {
      0% { r: 35px; opacity: 0.8; }
      50% { r: 55px; opacity: 0.2; }
      100% { r: 35px; opacity: 0.8; }
    }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-30px); }
      100% { transform: translateX(0); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-15px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.3; }
    }
    
    .pulsing-circle { animation: pulseRing 4s infinite ease-in-out; }
    .wave-line { animation: waveMove 6s infinite ease-in-out; }
    .particle { animation: floatParticle 3.5s infinite ease-in-out; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="316" x="2" y="2" rx="14" fill="none" stroke="url(#titleGrad)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Animated Dynamic Background Elements -->
  <g opacity="0.25">
    <path class="wave-line" d="M 0,220 Q 300,160 600,240 T 1200,180 V 320 H 0 Z" fill="url(#accentGlow)" />
    <circle class="particle" cx="150" cy="80" r="4" fill="#38bdf8" />
    <circle class="particle" cx="950" cy="70" r="6" fill="#c084fc" style="animation-delay: 1s;" />
    <circle class="particle" cx="1050" cy="230" r="5" fill="#818cf8" style="animation-delay: 2s;" />
    <circle class="particle" cx="80" cy="240" r="3" fill="#38bdf8" style="animation-delay: 1.5s;" />
  </g>

  <!-- Decorative Telephony / Network Graph Lines -->
  <g opacity="0.35" transform="translate(780, 40)">
    <line x1="100" y1="80" x2="220" y2="40" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="100" y1="80" x2="250" y2="120" stroke="#38bdf8" stroke-width="2" />
    <line x1="100" y1="80" x2="180" y2="190" stroke="#c084fc" stroke-width="2" stroke-dasharray="6,6" />
    
    <circle cx="100" cy="80" r="45" fill="none" stroke="#818cf8" stroke-width="2" class="pulsing-circle" />
    <circle cx="100" cy="80" r="28" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" />
    
    <path d="M 92,72 C 92,70 94,68 97,68 L 103,68 C 105,68 107,70 107,72 L 107,76 C 107,78 105,80 103,80 L 100,80 C 97,80 94,83 94,86 C 94,91 99,96 104,96 C 107,96 110,93 110,90 L 110,87 C 110,85 112,83 114,83 L 118,83 C 120,83 122,85 122,87 L 122,93 C 122,96 119,98 116,98 C 104,98 92,86 92,74 Z" fill="#38bdf8" transform="translate(-5, -5)" />

    <circle cx="220" cy="40" r="14" fill="#311042" stroke="#818cf8" stroke-width="2" />
    <circle cx="250" cy="120" r="18" fill="#311042" stroke="#c084fc" stroke-width="2" />
    <circle cx="180" cy="190" r="12" fill="#311042" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Foreground Content: Title, Subtitle, Badges -->
  <g transform="translate(60, 0)">
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="160" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" />
      <text x="14" y="18" class="badge-text" fill="#38bdf8">📞 Call Attribution</text>

      <rect x="172" y="0" width="150" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.5" />
      <text x="186" y="18" class="badge-text" fill="#818cf8">⚡ Dynamic DNI</text>

      <rect x="334" y="0" width="180" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.5" />
      <text x="348" y="18" class="badge-text" fill="#c084fc">🤖 AI Intelligence</text>
    </g>

    <text x="0" y="135" class="title" filter="url(#glow)">Awesome Call Tracking Platform</text>
    <text x="0" y="178" class="subtitle">Top Call Tracking &amp; Telephony Analytics Ecosystem 🚀</text>
    <text x="0" y="210" class="tagline">Curated directory of SaaS attribution tools, VoIP stacks (Asterisk, FreeSWITCH) &amp; Open-Source CDR engines.</text>

    <g transform="translate(0, 245)">
      <rect x="0" y="0" width="480" height="36" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#334155" />
      <text x="16" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="13" fill="#e2e8f0" font-weight="600">
        🏆 <tspan fill="#38bdf8">Top Commercial SaaS</tspan> &amp; <tspan fill="#c084fc">Open-Source Telephony Projects</tspan>
      </text>
    </g>
  </g>
</svg>
